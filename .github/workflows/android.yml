name: Android

on:
  push:
    paths:
      - "android/**"
      - "wfg/server/static/app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to update the "android-latest" pre-release with the new APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk FallGuard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FallGuard-apk
          path: FallGuard.apk
      - name: Publish to the android-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android ilova (oxirgi build)" \
              --notes "main tarmog'idan avtomatik yig'ilgan APK. Telefonga o'rnatish: docs/android.md"
          gh release upload android-latest FallGuard.apk --clobber
