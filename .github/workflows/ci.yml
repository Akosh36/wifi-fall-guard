name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [csi_rx, csi_tx, gsm_call, camera]
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.project }} for ESP32-S3
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/${{ matrix.project }}
          idf.py set-target esp32s3
          idf.py build
      - name: Per-node build script (receiver 5 / transmitter)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          case "${{ matrix.project }}" in
            csi_rx) python firmware/flash_node.py rx 5 --server-ip 192.168.4.20 --hz 50 --build-only ;;
            csi_tx) python firmware/flash_node.py tx --channel 11 --build-only ;;
            *) echo "no per-node build for ${{ matrix.project }}" ;;
          esac
