# WiFi Fall Guard runtime settings. Environment variables override these:
#   WFG_SOURCE, WFG_MODEL, WFG_TOKEN, WFG_TELEGRAM_TOKEN, WFG_TELEGRAM_CHAT_IDS, WFG_UDP_PORT

source: sim            # "udp" = real ESP32-S3 nodes, "sim" = built-in simulator
udp:
  host: 0.0.0.0
  port: 5500           # must match CONFIG_WFG_SERVER_PORT in firmware/csi_rx
nodes: [0, 1, 2]       # CONFIG_WFG_NODE_ID of each receiver
fs: 100.0              # packets per second sent by firmware/csi_tx

model: models/classic_sim.npz   # .npz = NumPy baseline, .pt = PyTorch model
hop_seconds: 0.5

detector:
  fall_threshold: 0.4       # probability needed to count a window as "fall"
  confirm_windows: 2        # consecutive fall windows before "fall suspected"
  inactivity_seconds: 20    # no walking for this long after a fall -> ALERT
  recovery_threshold: 0.6
  recovery_windows: 3       # walking windows that cancel the alarm

sim:
  room: demo
  speed: 1.0
  seed: 0

db: data/wfg.sqlite3
telegram:
  token: ""            # better: set WFG_TELEGRAM_TOKEN
  chat_ids: []
http:
  host: 0.0.0.0
  port: 8000
auth:
  token: ""            # API/app password; required when the server is reachable from the internet (better: WFG_TOKEN)

security:              # home security mode ("Qo'riqlash")
  exit_delay: 30       # seconds to leave the house after arming
  confirm_windows: 3   # 0.5 s windows with a person present before the intrusion alarm
  quiet_seconds: 60    # empty room this long ends the intrusion state

history_days: 7        # status history kept on the server (for the app's offline view)

# What happens after a fall (docs/escalation.md). The server never calls for help straight away:
#   1. watch for observe_seconds whether the person gets up, measure breathing and heart rate;
#   2. still down + abnormal vital signs -> automatic call after cancel_seconds (anyone may cancel);
#      still down + normal / unknown vital signs -> ask the owner "Call an ambulance?" (app + Telegram).
escalation:
  observe_seconds: 180       # 3 minutes
  heart_low: 45              # beats / min outside this range are abnormal
  heart_high: 130
  breath_low: 8              # breaths / min outside this range are abnormal
  breath_high: 30
  min_abnormal: 2            # abnormal readings needed before acting on them
  auto_call: true            # false = always ask a person first
  cancel_seconds: 30         # countdown before the automatic call
  approvals_required: 1      # "yes" answers needed when vital signs are normal (owner, relatives)
  no_answer_seconds: 600     # nobody answered the question -> call; 0 = never call without an answer
  min_nodes_online: 2        # with fewer boards online the system never decides on its own
  number: "103"              # tez yordam
  address: ""                # home address, sent with the call message
  call_webhook: ""           # optional: URL of a SIP / SMS gateway, gets a JSON POST when a call is decided

# Security mode ("Qo'riqlash"): movement in the armed house -> the owner is asked "Call the police?"
# at once; movement that goes on -> automatic call after a countdown (docs/escalation.md, section 7).
police:
  auto_call: true            # false = never call without a "yes"
  sustained_seconds: 60      # movement this long = a real intruder, start the countdown
  cancel_seconds: 30
  approvals_required: 1
  no_answer_seconds: 180     # movement goes on and nobody answered -> call; 0 = never
  min_nodes_online: 2
  number: "102"              # politsiya; the call goes through escalation.call_webhook too

camera:                      # optional add-on; a snapshot is taken only during a fall episode
  snapshot_url: ""           # e.g. http://192.168.1.20/snapshot.jpg (IP camera JPEG URL)

# Room layout for the 3D view in the Android app and on /app (metres).
# x = width, y = depth, z = height. Measure your room and the board positions.
room:
  name: Xona
  size: [4.0, 3.5, 2.7]
  tx: [0.3, 0.3, 1.2]            # csi_tx (router) board
  rx:                            # csi_rx boards, keyed by CONFIG_WFG_NODE_ID
    "0": [3.7, 0.4, 1.0]
    "1": [3.7, 3.1, 1.0]
    "2": [0.3, 3.1, 1.0]
  furniture:                     # kind: bed | chair | table | sofa; pos = centre [x, y]; size = [w, d]
    - {kind: bed, pos: [3.0, 2.4], size: [1.0, 2.0], rot: 0}
    - {kind: chair, pos: [0.9, 1.0], size: [0.5, 0.5], rot: 45}
    - {kind: table, pos: [0.9, 1.7], size: [0.9, 0.6], rot: 0}
